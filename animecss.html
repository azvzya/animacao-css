<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sarah anime</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"&gt;>

    
</head>
<body>
    <h1 id="titulo">Biblioteca Animate.CSS</h1>

    <img id="imagem" src="https://png.pngtree.com/thumb_back/fh260/background/20240517/pngtree-nature-beautiful-background-image-image_15794823.jpg"Paisagem natural">

    <p id="texto">Clique no botão para iniciar!</p>

    <button onclick="iniciar()">Iniciar animação</button>

    <script>
        function iniciar() {
            document.getElementById("texto").innerHTML = "A animação começará em 2 segundos!";

            setTimeout(function () {
                document.getElementById("imagem").classList.add("animate__animated", "animate__bounce");

                document.getElementById("texto").innerHTML = "Animação concluída!";
            }, 2000);
        }
    </script>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f0f0f0;
            padding: 30px;
        }

        img {
            width: 200px;
            border-radius: 10px;
        }

        button {
            background: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</body>
</html>
